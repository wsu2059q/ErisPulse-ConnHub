[project]
name = "ErisPulse-ConnHub"
version = "0.1.3"
description = "连接中心模块：查看/广播/关闭框架登记的 WS/SSE 连接，提供 HTTP API、SSE 事件流与实时面板"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "wsu2059q" } ]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ErisPulse-Testing",
]

[project.entry-points."erispulse.module"]
"ConnHub" = "ConnHub:Main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ConnHub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
